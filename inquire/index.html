<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inquire | Annie Ríos</title>
  <link rel="canonical" href="https://www.annieabstracts.com/inquire">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="sheet">
    <aside class="rail">
      <a class="name" href="/">Annie Ríos</a>
      <nav>
        <a href="/work/">Work</a>
        <a href="/itinerary/">Itinerary</a>
        <a href="/about/">Annie</a>
        <a href="/inquire/" aria-current="page">Inquire</a>
      </nav>
    </aside>
    <main>
      <div class="door">
        <p class="lead">Institutions, curators, collectors</p>
        <a class="mail" href="mailto:annieabstracts@gmail.com">annieabstracts@gmail.com</a>
        <form data-inquire>
          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Work
            <select id="work" name="work">
              <option value="">—</option>
              <option>Cost of Love</option>
              <option>Be the Light</option>
              <option>All the Ways We Shine</option>
              <option>Composition of a Refraction</option>
              <option>Studio visit / other</option>
            </select>
          </label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>
  <script src="/js/site.js"></script>
</body>
</html>
