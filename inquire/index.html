<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inquire | Annie Ríos</title>
  <link rel="canonical" href="https://www.annieabstracts.com/inquire">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
  <div class="sheet">
    <aside class="rail">
      <a class="name" href="/">Annie Ríos</a>
      <nav>
        <a href="/work/">Work</a>
        <a href="/itinerary/">Itinerary</a>
        <a href="/about/">Annie</a>
        <a href="/inquire/" aria-current="page">Inquire</a>
      </nav>
    </aside>
    <main>
      <div class="door">
        <p class="lead">Institutions, curators, collectors</p>
        <a class="mail" href="mailto:annieabstracts@gmail.com">annieabstracts@gmail.com</a>
        <form data-inquire>
          <label>Name <input type="text" name="name" required></label>
          <label>Email <input type="email" name="email" required></label>
          <label>Work
            <select id="work" name="work">
              <option value="">—</option>
              <optgroup label="Three Elements of a Refraction">
                <option>The Gift of an Abundant Life</option>
                <option>Feel My Love</option>
                <option>The Sun in an Empty Room</option>
                <option>What Remains Below</option>
                <option>Be the Light</option>
                <option>All the Ways We Shine</option>
                <option>Composition of a Refraction</option>
                <option>Composition of a Refraction 2</option>
                <option>The InBetween Space</option>
                <option>The Point of Incidence</option>
                <option>Rhythms and Reflections</option>
                <option>Rhythms and Reflections 2</option>
              </optgroup>
              <optgroup label="Show Me a Feeling">
                <option>Red Thread</option>
              </optgroup>
              <option>Studio visit / commission</option>
              <option>Other</option>
            </select>
          </label>
          <label>Message <textarea name="message" rows="5" required></textarea></label>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
    <footer class="site-foot">
      <div class="foot-group">
        <span class="foot-label">Contact</span>
        <a href="mailto:annieabstracts@gmail.com">annieabstracts@gmail.com</a>
      </div>
      <div class="foot-group">
        <span class="foot-label">Follow</span>
        <a href="https://www.instagram.com/annieabstracts" target="_blank" rel="noopener">Instagram</a>
      </div>
      <div class="foot-group">
        <span class="foot-label">Representation</span>
        <span>Galería Habitante, Panama City</span>
      </div>
      <div class="foot-group">
        <span class="foot-label">Inquiries</span>
        <a href="/inquire/">Acquire a work</a>
      </div>
      <p class="foot-copy">© 2026 Annie Ríos. All works and images are the property of the artist.</p>
    </footer>
  </div>
  <script src="/js/site.js"></script>
</body>
</html>
