<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#111;--soft:#666;--rule:#ddd;--bg:#fff}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit}
.nav{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;border-bottom:1px solid var(--rule)}
.nav-artist{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
.nav-back{font-size:11px;letter-spacing:.08em;color:var(--soft);text-decoration:none}
.nav-back:hover{color:var(--ink)}
.hero{width:100%;max-height:88vh;overflow:hidden;background:#f4f2ee;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;max-height:88vh;object-fit:contain;display:block}
.wrap{max-width:960px;margin:0 auto;padding:48px 32px 80px;display:grid;grid-template-columns:1fr 360px;gap:64px;align-items:start}
@media(max-width:720px){.wrap{grid-template-columns:1fr;gap:36px;padding:32px 20px 60px}}
.info-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
h1{font-size:28px;font-weight:300;font-style:italic;line-height:1.2;margin-bottom:4px}
.year{font-size:13px;color:var(--soft);margin-bottom:20px}
.spec-table{width:100%;border-collapse:collapse;margin:20px 0 28px}
.spec-table td{padding:9px 0;border-bottom:1px solid var(--rule);font-size:13px;vertical-align:top;line-height:1.5}
.spec-table td:first-child{width:110px;color:var(--soft);font-size:12px}
.inquire{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:#111;color:#fff;padding:12px 28px;text-decoration:none;margin-top:8px}
.inquire:hover{background:#333}
.sidebar{padding-top:4px}
.thumb-box{width:100%;background:#f4f2ee;margin-bottom:20px;overflow:hidden}
.thumb-box img{width:100%;display:block;object-fit:contain}
.qr-block{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--rule);margin-bottom:20px}
.qr-block img{width:56px;height:56px;flex-shrink:0}
.qr-text{font-size:10px;line-height:1.6;color:var(--soft)}
.exhibition{margin-top:32px;padding-top:20px;border-top:1px solid var(--rule)}
.exhibition-title{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft);margin-bottom:6px}
.exhibition-name{font-size:14px;font-weight:400;margin-bottom:2px}
.exhibition-detail{font-size:12px;color:var(--soft)}
</style>
